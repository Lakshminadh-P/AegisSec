# Prometheus Configuration for AegisSec
# Prometheus collects metrics from the application

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape AegisSec application metrics
  - job_name: 'aegissec'
    static_configs:
      - targets: ['aegissec:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
