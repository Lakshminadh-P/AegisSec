<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <span>AegisSec</span>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="vulnerabilities.html" class="nav-link">
                <i class="fa-solid fa-bug"></i>
                <span>Vulnerabilities</span>
            </a>
            <a href="scans.html" class="nav-link">
                <i class="fa-solid fa-radar-indicator"></i>
                <span>Scans</span>
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fa-solid fa-file-contract"></i>
                <span>Reports</span>
            </a>
            <a href="events.html" class="nav-link active">
                <i class="fa-solid fa-list-ul"></i>
                <span>Events</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-name" id="sidebar-username">User</div>
                <div class="user-role" id="sidebar-role">Role</div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="mb-4">Security Audit Log</h2>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Event Type</th>
                                <th>Description</th>
                                <th>Severity</th>
                            </tr>
                        </thead>
                        <tbody id="events-table-body">
                            <tr><td colspan="4" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadEvents() {
            const res = await apiCall('/api/events/');
            const tbody = document.getElementById('events-table-body');
            
            if (res && res.ok) {
                const events = await res.json();
                tbody.innerHTML = '';
                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No events found.</td></tr>';
                    return;
                }
                events.forEach(e => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${formatDate(e.timestamp)} <small class="text-muted">(${timeAgo(e.timestamp)})</small></td>
                            <td><strong>${e.event_type}</strong></td>
                            <td>${e.description}</td>
                            <td>${severityBadge(e.severity || 'LOW')}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load events.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (requireAuth()) {
                loadEvents();
            }
        });
    </script>
</body>
</html>
