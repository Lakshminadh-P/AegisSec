<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="card login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved fa-3x" style="color: var(--accent);"></i>
            <h3 class="mt-3 text-white">AegisSec</h3>
            <p class="text-muted">DevSecOps Platform</p>
        </div>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label text-white">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-white">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3" id="login-btn">
                Log In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
            <p class="text-muted mb-2 text-center"><small>Demo Credentials:</small></p>
            <ul class="list-unstyled text-muted small text-center mb-0">
                <li>admin / admin123</li>
                <li>analyst / analyst123</li>
                <li>developer / dev123</li>
            </ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging in...';
            
            const result = await login(username, password);
            
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = result.error;
                errorDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Log In';
            }
        });

        // Check if already logged in
        if (getToken()) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
