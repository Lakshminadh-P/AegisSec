<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerabilities - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <span>AegisSec</span>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="vulnerabilities.html" class="nav-link active">
                <i class="fa-solid fa-bug"></i>
                <span>Vulnerabilities</span>
            </a>
            <a href="scans.html" class="nav-link">
                <i class="fa-solid fa-radar-indicator"></i>
                <span>Scans</span>
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fa-solid fa-file-contract"></i>
                <span>Reports</span>
            </a>
            <a href="events.html" class="nav-link">
                <i class="fa-solid fa-list-ul"></i>
                <span>Events</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-name" id="sidebar-username">User</div>
                <div class="user-role" id="sidebar-role">Role</div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Vulnerabilities</h2>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-3">
                        <select class="form-select" id="filter-severity">
                            <option value="">All Severities</option>
                            <option value="CRITICAL">Critical</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filter-status">
                            <option value="">All Statuses</option>
                            <option value="OPEN">Open</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="FIXED">Fixed</option>
                            <option value="FALSE_POSITIVE">False Positive</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="filter-search" placeholder="Search by title...">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Severity</th>
                                <th>Source</th>
                                <th>Component</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vuln-table-body">
                            <tr><td colspan="7" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="vulnModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="vulnModalLabel">Vulnerability Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="vulnModalBody">
              Loading...
          </div>
          <div class="modal-footer">
              <select class="form-select w-auto" id="update-status-select">
                  <option value="OPEN">Open</option>
                  <option value="IN_PROGRESS">In Progress</option>
                  <option value="FIXED">Fixed</option>
                  <option value="FALSE_POSITIVE">False Positive</option>
              </select>
              <button type="button" class="btn btn-primary" id="btn-update-status">Update Status</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentVulnId = null;
        const modal = new bootstrap.Modal(document.getElementById('vulnModal'));

        async function loadVulns() {
            const sev = document.getElementById('filter-severity').value;
            const stat = document.getElementById('filter-status').value;
            const search = document.getElementById('filter-search').value;

            let url = '/api/vulnerabilities/?';
            if(sev) url += `severity=${sev}&`;
            if(stat) url += `status=${stat}&`;
            if(search) url += `search=${search}`;

            const res = await apiCall(url);
            const tbody = document.getElementById('vuln-table-body');
            tbody.innerHTML = '';

            if (res && res.ok) {
                const data = await res.json();
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No vulnerabilities found.</td></tr>';
                    return;
                }
                data.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.style.cursor = 'pointer';
                    tr.innerHTML = `
                        <td>${v.id}</td>
                        <td>${v.title}</td>
                        <td>${severityBadge(v.severity)}</td>
                        <td>${v.source}</td>
                        <td>${v.component || '-'}</td>
                        <td>${statusBadge(v.status)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info" onclick="viewVuln(${v.id}); event.stopPropagation();">
                                <i class="fa-regular fa-eye"></i> View
                            </button>
                        </td>
                    `;
                    tr.onclick = () => viewVuln(v.id);
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load vulnerabilities.</td></tr>';
            }
        }

        async function viewVuln(id) {
            currentVulnId = id;
            modal.show();
            document.getElementById('vulnModalBody').innerHTML = 'Loading...';
            
            const res = await apiCall(`/api/vulnerabilities/${id}`);
            if (res && res.ok) {
                const v = await res.json();
                document.getElementById('vulnModalBody').innerHTML = `
                    <div class="mb-3">
                        <h4 class="text-white">${v.title}</h4>
                        <div>${severityBadge(v.severity)} ${statusBadge(v.status)}</div>
                    </div>
                    <p><strong>Description:</strong> <br>${v.description || 'No description provided.'}</p>
                    <p><strong>Component:</strong> ${v.component || 'N/A'}</p>
                    <p><strong>Source:</strong> ${v.source}</p>
                    <p><strong>Remediation:</strong> <br>${v.remediation || 'N/A'}</p>
                `;
                document.getElementById('update-status-select').value = v.status;
            } else {
                document.getElementById('vulnModalBody').innerHTML = 'Error loading details.';
            }
        }

        document.getElementById('btn-update-status').addEventListener('click', async () => {
            if(!currentVulnId) return;
            const newStatus = document.getElementById('update-status-select').value;
            const res = await apiCall(`/api/vulnerabilities/${currentVulnId}/status?new_status=${newStatus}`, {
                method: 'PUT'
            });
            if (res && res.ok) {
                showToast('Status updated successfully', 'success');
                modal.hide();
                loadVulns();
            } else {
                showToast('Failed to update status', 'error');
            }
        });

        document.getElementById('filter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            loadVulns();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (requireAuth()) {
                loadVulns();
            }
        });
    </script>
</body>
</html>
