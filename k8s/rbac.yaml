# AegisSec RBAC (Role-Based Access Control)
# Demonstrates the principle of least privilege in Kubernetes

# Role: minimal permissions for AegisSec
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegissec-role
rules:
  # Only allow reading ConfigMaps and Secrets in the same namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  # Allow reading pod info (for health monitoring)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# Bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegissec-rolebinding
subjects:
  - kind: ServiceAccount
    name: aegissec-sa
roleRef:
  kind: Role
  name: aegissec-role
  apiGroup: rbac.authorization.k8s.io
