<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <span>AegisSec</span>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="vulnerabilities.html" class="nav-link">
                <i class="fa-solid fa-bug"></i>
                <span>Vulnerabilities</span>
            </a>
            <a href="scans.html" class="nav-link">
                <i class="fa-solid fa-radar-indicator"></i>
                <span>Scans</span>
            </a>
            <a href="reports.html" class="nav-link active">
                <i class="fa-solid fa-file-contract"></i>
                <span>Reports</span>
            </a>
            <a href="events.html" class="nav-link">
                <i class="fa-solid fa-list-ul"></i>
                <span>Events</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-name" id="sidebar-username">User</div>
                <div class="user-role" id="sidebar-role">Role</div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="mb-4">Security Reports</h2>

        <div class="card mb-4">
            <div class="card-header">Generate Report</div>
            <div class="card-body">
                <p>Generate comprehensive reports containing all current vulnerabilities, stats, and recent scan data.</p>
                <div class="d-flex gap-3">
                    <button class="btn btn-primary" id="btn-json">
                        <i class="fa-solid fa-file-code"></i> Get JSON Report
                    </button>
                    <button class="btn btn-outline-info" id="btn-html">
                        <i class="fa-solid fa-file-lines"></i> Open HTML Report
                    </button>
                </div>
            </div>
        </div>

        <div class="card d-none" id="json-preview-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>JSON Output Preview</span>
                <button class="btn btn-sm btn-outline-secondary" id="btn-copy">
                    <i class="fa-regular fa-copy"></i> Copy
                </button>
            </div>
            <div class="card-body p-0">
                <pre class="m-0 p-3" style="max-height: 500px; overflow-y: auto; color: #e0e0e0; background-color: rgba(0,0,0,0.2);"><code id="json-output"></code></pre>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
        });

        document.getElementById('btn-json').addEventListener('click', async () => {
            const btn = document.getElementById('btn-json');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
            btn.disabled = true;

            const res = await apiCall('/api/reports/json');
            btn.innerHTML = '<i class="fa-solid fa-file-code"></i> Get JSON Report';
            btn.disabled = false;

            if (res && res.ok) {
                const data = await res.json();
                document.getElementById('json-output').textContent = JSON.stringify(data, null, 2);
                document.getElementById('json-preview-card').classList.remove('d-none');
                showToast('Report generated', 'success');
            } else {
                showToast('Failed to generate report', 'error');
            }
        });

        document.getElementById('btn-html').addEventListener('click', () => {
            const token = getToken();
            // Assuming HTML report doesn't easily support auth header via simple open, might need a workaround or pass token via query (not secure) or cookie. 
            // For this demo structure, we will just try to open it and let backend handle if it needs a cookie/token, or maybe fetch it and blob it.
            // A secure way for an authenticated download:
            fetch('/api/reports/html', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => {
                if(response.status === 401) { logout(); return; }
                return response.blob();
            })
            .then(blob => {
                if(blob) {
                    const url = window.URL.createObjectURL(blob);
                    window.open(url, '_blank');
                }
            })
            .catch(err => {
                showToast('Error opening HTML report', 'error');
            });
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            const content = document.getElementById('json-output').textContent;
            navigator.clipboard.writeText(content).then(() => {
                showToast('Copied to clipboard', 'info');
            });
        });
    </script>
</body>
</html>
