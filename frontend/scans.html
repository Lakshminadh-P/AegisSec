<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scans - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <span>AegisSec</span>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="vulnerabilities.html" class="nav-link">
                <i class="fa-solid fa-bug"></i>
                <span>Vulnerabilities</span>
            </a>
            <a href="scans.html" class="nav-link active">
                <i class="fa-solid fa-radar-indicator"></i>
                <span>Scans</span>
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fa-solid fa-file-contract"></i>
                <span>Reports</span>
            </a>
            <a href="events.html" class="nav-link">
                <i class="fa-solid fa-list-ul"></i>
                <span>Events</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-name" id="sidebar-username">User</div>
                <div class="user-role" id="sidebar-role">Role</div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Security Scans</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#scanModal">
                <i class="fa-solid fa-play"></i> Run New Scan
            </button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Scanner</th>
                                <th>Type</th>
                                <th>Target</th>
                                <th>Status</th>
                                <th>Findings</th>
                                <th>Started</th>
                                <th>Completed</th>
                            </tr>
                        </thead>
                        <tbody id="scans-table-body">
                            <tr><td colspan="8" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scan Modal -->
    <div class="modal fade" id="scanModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Run New Scan</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="run-scan-form">
                <div class="mb-3">
                    <label class="form-label text-white">Scanner Tool</label>
                    <select class="form-select" id="scan-tool" required>
                        <option value="">Select scanner...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Target (URL or Path)</label>
                    <input type="text" class="form-control" id="scan-target" required placeholder="e.g. src/ or https://example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Scan Type</label>
                    <select class="form-select" id="scan-type">
                        <option value="SAST">SAST</option>
                        <option value="DAST">DAST</option>
                        <option value="SCA">SCA</option>
                        <option value="SECRETS">Secrets</option>
                        <option value="CONTAINER">Container</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="btn-run-scan">Run Scan</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        const scanModal = new bootstrap.Modal(document.getElementById('scanModal'));

        function getScanStatusBadge(status) {
            switch(status) {
                case 'PENDING': return '<span class="badge bg-warning text-dark">PENDING</span>';
                case 'RUNNING': return '<span class="badge bg-info text-dark">RUNNING</span>';
                case 'COMPLETED': return '<span class="badge bg-success">COMPLETED</span>';
                case 'FAILED': return '<span class="badge bg-danger">FAILED</span>';
                default: return `<span class="badge bg-secondary">${status}</span>`;
            }
        }

        async function loadScans() {
            const res = await apiCall('/api/scans/');
            const tbody = document.getElementById('scans-table-body');
            
            if (res && res.ok) {
                const scans = await res.json();
                tbody.innerHTML = '';
                if (scans.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">No scans found.</td></tr>';
                    return;
                }
                scans.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${s.id}</td>
                            <td>${s.scanner}</td>
                            <td>${s.scan_type}</td>
                            <td>${s.target}</td>
                            <td>${getScanStatusBadge(s.status)}</td>
                            <td>${s.findings_count || 0}</td>
                            <td>${formatDate(s.started_at)}</td>
                            <td>${formatDate(s.completed_at)}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Failed to load scans.</td></tr>';
            }
        }

        async function loadTools() {
            const res = await apiCall('/api/scans/tools');
            if (res && res.ok) {
                const tools = await res.json();
                const select = document.getElementById('scan-tool');
                select.innerHTML = '<option value="">Select scanner...</option>';
                Object.keys(tools).forEach(tool => {
                    const isAvail = tools[tool];
                    select.innerHTML += `<option value="${tool}" ${!isAvail ? 'disabled' : ''}>${tool} ${isAvail ? '✅' : '❌'}</option>`;
                });
            }
        }

        document.getElementById('run-scan-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-run-scan');
            btn.disabled = true;
            btn.textContent = 'Starting...';

            const payload = {
                scan_type: document.getElementById('scan-type').value,
                scanner: document.getElementById('scan-tool').value,
                target: document.getElementById('scan-target').value
            };

            const res = await apiCall('/api/scans/run', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            btn.disabled = false;
            btn.textContent = 'Run Scan';

            if (res && res.ok) {
                showToast('Scan started successfully', 'success');
                scanModal.hide();
                loadScans();
            } else {
                showToast('Failed to start scan', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (requireAuth()) {
                loadScans();
                loadTools();
                // Auto-refresh every 10s
                setInterval(loadScans, 10000);
            }
        });
    </script>
</body>
</html>
