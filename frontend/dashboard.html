<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AegisSec DevSecOps</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved"></i>
            <span>AegisSec</span>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link active">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="vulnerabilities.html" class="nav-link">
                <i class="fa-solid fa-bug"></i>
                <span>Vulnerabilities</span>
            </a>
            <a href="scans.html" class="nav-link">
                <i class="fa-solid fa-radar-indicator"></i>
                <span>Scans</span>
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fa-solid fa-file-contract"></i>
                <span>Reports</span>
            </a>
            <a href="events.html" class="nav-link">
                <i class="fa-solid fa-list-ul"></i>
                <span>Events</span>
            </a>
            <a href="settings.html" class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-name" id="sidebar-username">User</div>
                <div class="user-role" id="sidebar-role">Role</div>
            </div>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="mb-4">Security Dashboard</h2>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="card-title text-muted">Security Score</h5>
                            <h2 class="mb-0" id="security-score">--</h2>
                        </div>
                        <div style="width: 80px; height: 80px;">
                            <canvas id="scoreChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h5 class="card-title text-muted">Pipeline Status</h5>
                            <h2 class="mb-0" id="pipeline-status">--</h2>
                        </div>
                        <i class="fa-solid fa-server fa-3x text-muted"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="text-muted">Critical</div>
                    <div class="stat-value text-critical" id="stat-critical">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="text-muted">High</div>
                    <div class="stat-value text-high" id="stat-high">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="text-muted">Medium</div>
                    <div class="stat-value text-medium" id="stat-medium">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="text-muted">Low</div>
                    <div class="stat-value text-low" id="stat-low">0</div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">Vulnerability Status</div>
                    <div class="card-body" style="position: relative; height:300px; width:100%">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">Vulnerabilities by Source</div>
                    <div class="card-body" style="position: relative; height:300px; width:100%">
                        <canvas id="sourceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Recent Security Events</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Severity</th>
                            </tr>
                        </thead>
                        <tbody id="events-table-body">
                            <tr><td colspan="4" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;

            // Fetch Stats
            const statsRes = await apiCall('/api/dashboard/stats');
            if (statsRes && statsRes.ok) {
                const stats = await statsRes.json();
                
                // Update basic stats
                document.getElementById('stat-critical').textContent = stats.by_severity?.CRITICAL || 0;
                document.getElementById('stat-high').textContent = stats.by_severity?.HIGH || 0;
                document.getElementById('stat-medium').textContent = stats.by_severity?.MEDIUM || 0;
                document.getElementById('stat-low').textContent = stats.by_severity?.LOW || 0;

                // Score Chart
                const score = 85; // mock or from stats
                document.getElementById('security-score').textContent = score + '/100';
                new Chart(document.getElementById('scoreChart'), {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [score, 100 - score],
                            backgroundColor: ['#00d4ff', '#131a3e'],
                            borderWidth: 0
                        }]
                    },
                    options: { cutout: '80%', responsive: true, maintainAspectRatio: false, plugins: { tooltip: { enabled: false } } }
                });

                // Status Chart
                new Chart(document.getElementById('statusChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Open', 'In Progress', 'Fixed', 'False Positive'],
                        datasets: [{
                            data: [
                                stats.by_status?.OPEN || 0,
                                stats.by_status?.IN_PROGRESS || 0,
                                stats.by_status?.FIXED || 0,
                                stats.by_status?.FALSE_POSITIVE || 0
                            ],
                            backgroundColor: ['#dc3545', '#fd7e14', '#198754', '#6c757d'],
                            borderWidth: 1, borderColor: '#131a3e'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#e0e0e0' } } } }
                });

                // Source Chart
                const sources = Object.keys(stats.by_source || {});
                const sourceData = Object.values(stats.by_source || {});
                new Chart(document.getElementById('sourceChart'), {
                    type: 'bar',
                    data: {
                        labels: sources,
                        datasets: [{
                            label: 'Count',
                            data: sourceData,
                            backgroundColor: '#00d4ff'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#e0e0e0' } }, x: { grid: { display: false }, ticks: { color: '#e0e0e0' } } }, plugins: { legend: { display: false } } }
                });
            }

            // Fetch Events
            const eventsRes = await apiCall('/api/events/?limit=5');
            if (eventsRes && eventsRes.ok) {
                const events = await eventsRes.json();
                const tbody = document.getElementById('events-table-body');
                tbody.innerHTML = '';
                if(events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No recent events</td></tr>';
                } else {
                    events.forEach(e => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${timeAgo(e.timestamp)}</td>
                                <td>${e.event_type}</td>
                                <td>${e.description}</td>
                                <td>${severityBadge(e.severity || 'LOW')}</td>
                            </tr>
                        `;
                    });
                }
            }
        });
    </script>
</body>
</html>
